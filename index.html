<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Day</title>
    <link rel="stylesheet" href="style.css" type="text/css"/>
    <link rel="shortcut icon" href="img/silka.png"/>
    <script type="text/javascript" src="skrypt.js"></script>
</head>
<body>
    <div id="container">
        <div id="starter">
            <div id="zakladka"> 
                <img src="img/dodaj.png" width="70px" height="70px" alt="silka">
                <b>DODAJ</b>
            </div>
            <div id="zakladka"> 
                <img src="img/silka.png" width="70px" height="70px">
                <b>SILKA</b>
            </div>
            <div id="zakladka"> 
                <img src="img/book.png" width="70px" height="70px">
                <b>KSIAZKI</b>
            </div>
            <div id="zakladka"> 
                <img src="img/mood.png" width="70px" height="70px">
                <b>MOOD</b>
            </div>
        </div>
        <div id="zawartosc">
            <div id="formularz">
                <form action="" id="ramka" >
                    <fieldset id="pole">
                        <legend>Dodaj</legend>
                        <div>
                            <form action="">
                                <fieldset >
                                    <div><label><input type="radio" name="rodzaj">Trening</label></div>
                                    <div><label><input type="radio" name="rodzaj">Ksiazki</label></div>
                                    <div><label><input type="radio" name="rodzaj">Mood</label></div>
                               </fieldset>
                            </form>
                        </div>
                        <div id="przycisk">
                            <input type="button" value="Dalej">
                        </div>
                    </fieldset>
                </form>
            </div>
            <div id="opis">
                <div id="opistreningu">
                    <form>
                        <fieldset id="obramowanie">
                            <legend>Dodaj Trening</legend>
                        </fieldset>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
