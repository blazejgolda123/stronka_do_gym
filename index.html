<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Day</title>
    <link rel="stylesheet" href="style.css" type="text/css"/>
    <link rel="shortcut icon" href="img/silka.png"/>
</head>
<body>
    <div id="container">
        <div id="starter">
            <div id="zakladka"> 
                <img src="img/dodaj.png" width="70px" height="70px" alt="silka">
                <b>DODAJ</b>
            </div>
            <div id="zakladka"> 
                <img src="img/silka.png" width="70px" height="70px">
                <b>SILKA</b>
            </div>
            <div id="zakladka"> 
                <img src="img/book.png" width="70px" height="70px">
                <b>KSIAZKI</b>
            </div>
            <div id="zakladka"> 
                <img src="img/mood.png" width="70px" height="70px">
                <b>MOOD</b>
            </div>
        </div>
        <div id="zawartosc">
            <div id="formularz">
                <form action="" id="ramka" >
                    <fieldset id="pole">
                        <legend>Dodaj</legend>
                        <div>
                            <form action="">
                                <fieldset >
                                    <div><label><input type="radio" name="opcja" value="trening">Trening</label></div>
                                    <div><label><input type="radio" name="opcja" value="ksiazki">Ksiazki</label></div>
                                    <div><label><input type="radio" name="opcja" value="mood">Mood</label></div>
                                    
                               </fieldset>
                            </form>
                        </div>
                        <div id="przycisk">
                            <input type="button" id="dalej" value="dalej">
                        </div>
                    </fieldset>
                </form>
            </div>
            <div id="dodaj_trening">
                <form id="posrednik">
                    <fieldset id="pole_treningu">
                        <legend>Dodaj trening</legend>
                        <div id="dzien_tyg">
                            <fieldset style="height: 500px; border-radius: 20px; border: 3px solid rgb(149, 9, 192);">
                            <div id="day"><label><input type="radio" name="opcja" value="poniedzialek">Poniedzialek</label></div>
                            <div id="day"><label><input type="radio" name="opcja" value="sroda">sroda</label></div>
                            <div id="day"><label><input type="radio" name="opcja" value="piatek">piatek</label></div>
                            </fieldset>
                        </div>
                        <div id="podaj_cwiczenia">
                            <fieldset id="jakie_cwiczenie">
                                <div><label>-Przysiady ze sztanga: <input type="text" placeholder="np. 70kg">, ile serii: <input type="text>">, ile powtorzen: <input type="text>"> </label></div>
                                <div><label>-OHP: <input type="text" placeholder="np. 30kg">, ile serii: <input type="text>">, ile powtorzen: <input type="text>"> </label></div>
                                <div><label>-Wyciskanie na siedzaco: <input type="text" placeholder="np. 17.5kg">, ile serii: <input type="text>">, ile powtorzen: <input type="text>"> </label></div>
                                <div><label>-motyle: <input type="text" placeholder="np. 75kg">, ile serii: <input type="text">, ile powtorzen: <input type="text>"> </label></div>
                                <div><label>-Wyciskanie francuskie: <input type="text" placeholder="np. 17.5kg">, ile serii: <input type="text>">, ile powtorzen: <input type="text>"> </label></div>
                                <div><label>-Ab wheel, ile serii: <input type="text>">, ile powtorzen: <input type="text>"> </label></div>
                                <div><label>-Deska: <input type="text" placeholder="np. 30sek"></label></div>
                            </fieldset>

                        </div>
                        </div>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
    <script src="skrypt.js"></script>
</body>
</html>
